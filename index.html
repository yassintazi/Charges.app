<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Charges Q&G">
<title>Charges Q & G — NF P 06-001 & Eurocode (Pro Edition)</title>
<link rel="manifest" href='data:application/json,{"name":"Charges Q&G NF P 06-001","short_name":"Charges Q&G","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#6366f1"}'>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --dash-bg:#ffffff;--dash-sidebar-bg:#f8f9fa;--dash-card-bg:#ffffff;
    --dash-text:#1a1a2e;--dash-text-sec:#6b7280;--dash-text-ter:#9ca3af;
    --dash-border:#e5e7eb;--dash-accent:#6366f1;
    --dash-q-color:#3b82f6;--dash-g-color:#10b981;
    --highlight-bg:#fef3c7;--highlight-text:#92400e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#e5e7eb;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
  .widget-root{display:flex;height:90vh;max-height:850px;width:100%;max-width:1300px;border-radius:16px;overflow:hidden;background:var(--dash-bg);box-shadow:0 20px 60px rgba(0,0,0,.15);border:1px solid var(--dash-border);transition:all .3s ease;position:relative}
  .sidebar{width:230px;background:var(--dash-sidebar-bg);border-right:1px solid var(--dash-border);padding:18px 10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;overflow-y:auto}
  .sidebar-title{font-size:12px;font-weight:700;color:var(--dash-text-sec);margin-bottom:10px;padding:0 8px;text-transform:uppercase;letter-spacing:.5px}
  .cat-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:none;background:transparent;color:var(--dash-text-sec);font-size:12px;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit;width:100%}
  .cat-btn:hover{background:rgba(0,0,0,.04);color:var(--dash-text)}
  .cat-btn.active{background:var(--dash-accent);color:#fff;font-weight:600}
  .cat-icon{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}
  .cat-btn.active .cat-icon{background:rgba(255,255,255,.2)}
  .cat-btn:not(.active) .cat-icon{background:rgba(0,0,0,.05)}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--dash-bg);position:relative}
  .topbar{padding:12px 18px;border-bottom:1px solid var(--dash-border);display:flex;align-items:center;gap:10px;background:var(--dash-bg)}
  .search-box{flex:1;position:relative}
  .search-box input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--dash-border);border-radius:10px;font-size:13px;font-family:inherit;background:var(--dash-card-bg);color:var(--dash-text);outline:none;transition:border-color .2s}
  .search-box input:focus{border-color:var(--dash-accent)}
  .search-box::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5}
  .badge-count{font-size:11px;color:var(--dash-text-sec);background:var(--dash-sidebar-bg);padding:6px 12px;border-radius:20px;border:1px solid var(--dash-border);white-space:nowrap;font-weight:600}
  .theme-switcher{position:relative}
  .theme-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--dash-border);background:var(--dash-card-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;color:var(--dash-text)}
  .theme-btn:hover{border-color:var(--dash-accent)}
  .theme-menu{position:absolute;top:44px;right:0;background:var(--dash-card-bg);border:1px solid var(--dash-border);border-radius:12px;padding:8px;display:none;flex-direction:column;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:100;min-width:160px}
  .theme-menu.open{display:flex}
  .theme-option{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:12px;font-family:inherit;color:var(--dash-text);transition:background .2s;width:100%;text-align:left}
  .theme-option:hover{background:var(--dash-sidebar-bg)}
  .theme-option.active{background:rgba(99,102,241,.12);font-weight:600}
  .theme-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--dash-border)}
  .mobile-cat-bar{display:none;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--dash-border);gap:6px;background:var(--dash-sidebar-bg);-webkit-overflow-scrolling:touch}
  .mobile-cat-pill{padding:6px 12px;border-radius:20px;border:1px solid var(--dash-border);background:var(--dash-card-bg);color:var(--dash-text-sec);font-size:11px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
  .mobile-cat-pill.active{background:var(--dash-accent);color:#fff;border-color:var(--dash-accent);font-weight:600}
  .room-list{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-content:start;background:var(--dash-bg)}
  .room-card{padding:14px;border:1px solid var(--dash-border);border-radius:12px;cursor:pointer;transition:all .2s;background:var(--dash-card-bg);text-align:left;font-family:inherit;position:relative}
  .room-card:hover{border-color:var(--dash-accent);box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-2px)}
  .room-card.selected{border-color:var(--dash-accent);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
  .room-card .room-name{font-size:13px;font-weight:600;color:var(--dash-text);line-height:1.4;margin-bottom:8px}
  .room-card .room-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
  .room-card .tag{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600}
  .room-card .cat-tag{font-size:9px;padding:3px 6px;border-radius:4px;background:rgba(99,102,241,.08);color:var(--dash-accent);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .room-card .match-preview{font-size:10px;color:var(--dash-text-ter);margin-top:6px;line-height:1.4;font-style:italic}
  .detail-panel{width:360px;background:var(--dash-sidebar-bg);border-left:1px solid var(--dash-border);padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex-shrink:0}
  .detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dash-text-ter);font-size:13px;text-align:center;gap:10px}
  .detail-header{display:flex;align-items:center;gap:12px;margin-bottom:2px}
  .detail-header .icon{font-size:26px}
  .detail-title{font-size:16px;font-weight:700;color:var(--dash-text);line-height:1.3}
  .detail-cat{font-size:10px;color:var(--dash-text-ter);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .big-cards{display:flex;flex-direction:column;gap:12px}
  .big-card{border-radius:14px;padding:16px;position:relative;overflow:hidden;background:var(--dash-card-bg);border:1px solid var(--dash-border)}
  .big-card.q-card{border-color:rgba(59,130,246,.3);background:linear-gradient(135deg,rgba(59,130,246,.06),var(--dash-card-bg))}
  .big-card.g-card{border-color:rgba(16,185,129,.3);background:linear-gradient(135deg,rgba(16,185,129,.06),var(--dash-card-bg))}
  .big-card .bc-label{font-size:11px;color:var(--dash-text-sec);margin-bottom:8px;display:flex;align-items:center;gap:6px;font-weight:600}
  .big-card .bc-value{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .big-card.q-card .bc-value{color:var(--dash-q-color)}
  .big-card.g-card .bc-value{color:var(--dash-g-color)}
  .big-card .bc-unit{font-size:11px;color:var(--dash-text-ter);margin-top:6px}
  .big-card .bc-bar{height:5px;border-radius:3px;margin-top:12px;background:var(--dash-border);overflow:hidden}
  .big-card .bc-bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
  .q-card .bc-bar-fill{background:var(--dash-q-color)}
  .g-card .bc-bar-fill{background:var(--dash-g-color)}
  .q-input{width:100%;padding:8px 12px;border:2px solid var(--dash-border);border-radius:10px;font-size:16px;font-weight:700;color:var(--dash-q-color);background:var(--dash-bg);font-family:inherit;outline:none;margin-top:6px;transition:border-color .2s}
  .q-input:focus{border-color:var(--dash-q-color)}
  .range-info{font-size:10px;color:var(--dash-text-ter);margin-top:6px;font-weight:500}
  
  /* CALCULATOR MODULE */
  .calc-box{background:var(--dash-card-bg);border:1px solid var(--dash-border);border-radius:12px;padding:14px}
  .calc-box h4{font-size:11px;font-weight:700;color:var(--dash-accent);margin:0 0 10px 0;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
  .calc-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .calc-field label{display:block;font-size:10px;color:var(--dash-text-sec);margin-bottom:4px;font-weight:600}
  .calc-field input{width:100%;padding:6px 8px;border:1px solid var(--dash-border);border-radius:6px;font-size:12px;background:var(--dash-bg);color:var(--dash-text);font-weight:600}
  .calc-res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--dash-sidebar-bg);padding:10px;border-radius:8px}
  .calc-res-item{text-align:center}
  .calc-res-item .lbl{font-size:9px;color:var(--dash-text-sec);font-weight:700;text-transform:uppercase}
  .calc-res-item .val{font-size:14px;font-weight:700;color:var(--dash-accent);margin-top:2px}

  .info-section{background:var(--dash-card-bg);border:1px solid var(--dash-border);border-radius:12px;padding:14px}
  .info-section h4{font-size:10px;font-weight:700;color:var(--dash-text-sec);margin:0 0 8px 0;text-transform:uppercase;letter-spacing:.4px}
  .info-section p{font-size:12px;color:var(--dash-text-sec);line-height:1.6;margin:0}
  .scenario-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
  .scenario-table th{background:var(--dash-sidebar-bg);padding:8px 6px;text-align:left;font-weight:600;color:var(--dash-text-sec);border-bottom:2px solid var(--dash-border);font-size:9px;text-transform:uppercase;letter-spacing:.3px}
  .scenario-table td{padding:8px 6px;border-bottom:1px solid var(--dash-border);color:var(--dash-text);vertical-align:top}
  .scenario-table td:first-child{font-weight:600;color:var(--dash-text-sec);width:30%}
  .scenario-table tr:hover td{background:rgba(99,102,241,.03)}
  .scenario-table .active-row td{background:rgba(59,130,246,.08)!important;color:var(--dash-q-color)!important;font-weight:700}
  .scenario-table .active-row td:first-child{color:var(--dash-q-color)!important}
  .explanation-box{background:var(--dash-card-bg);border:1px solid var(--dash-border);border-radius:12px;padding:14px}
  .explanation-box h4{font-size:10px;font-weight:700;color:var(--dash-text-sec);margin:0 0 10px 0;text-transform:uppercase;letter-spacing:.4px}
  .explanation-box ul{margin:0;padding-left:16px;font-size:11.5px;color:var(--dash-text-sec);line-height:1.6}
  .explanation-box li{margin-bottom:6px}
  .ref-box{background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.15);border-radius:12px;padding:12px 14px}
  .ref-box h4{font-size:10px;font-weight:700;color:var(--dash-accent);margin:0 0 6px 0;text-transform:uppercase;letter-spacing:.4px}
  .ref-box p{font-size:11px;color:var(--dash-text-sec);margin:0;line-height:1.5}
  .hl{background:var(--highlight-bg);color:var(--highlight-text);padding:0 3px;border-radius:4px;font-weight:700}

  .action-btn{width:100%;padding:10px;border-radius:10px;border:none;background:var(--dash-accent);color:#fff;font-weight:600;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .2s}
  .action-btn:hover{opacity:.9}

  /* MOBILE BOTTOM SHEET */
  .mobile-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s ease;backdrop-filter:blur(2px)}
  .mobile-backdrop.open{opacity:1;pointer-events:auto}
  .mobile-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--dash-bg);border-radius:20px 20px 0 0;z-index:210;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
  .mobile-sheet.open{transform:translateY(0)}
  .sheet-handle{width:40px;height:4px;background:var(--dash-border);border-radius:2px;margin:10px auto;flex-shrink:0}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px;border-bottom:1px solid var(--dash-border);flex-shrink:0}
  .sheet-title{font-size:15px;font-weight:700;color:var(--dash-text)}
  .sheet-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--dash-border);background:var(--dash-card-bg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--dash-text)}
  .sheet-content{flex:1;overflow-y:auto;padding:16px 20px 30px;display:flex;flex-direction:column;gap:14px}

  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-thumb{background:var(--dash-border);border-radius:3px}

  @media(max-width:900px){
    body{padding:0}
    .widget-root{border-radius:0;height:100vh;max-height:none;max-width:none;border:none}
    .detail-panel,.sidebar{display:none}
    .mobile-cat-bar{display:flex}
    .room-list{grid-template-columns:1fr;padding:12px}
    .room-card{padding:14px}
    .topbar{padding:10px 12px}
  }
  @media(min-width:901px){
    .mobile-backdrop,.mobile-sheet,.mobile-cat-bar{display:none!important}
  }
</style>
</head>
<body>

<div class="widget-root" id="dashRoot">
  <!-- Desktop Sidebar -->
  <div class="sidebar">
    <div class="sidebar-title">Catégories</div>
    <div id="desktopCatList"></div>
  </div>

  <div class="main">
    <!-- Topbar -->
    <div class="topbar">
      <div class="search-box"><input type="text" id="searchInput" placeholder="Rechercher (ex: hospital, 500, terrain...)" oninput="doSearch()"></div>
      <div class="badge-count" id="countBadge">—</div>
      <div class="theme-switcher">
        <button class="theme-btn" onclick="toggleThemeMenu()" title="Changer le thème">🎨</button>
        <div class="theme-menu" id="themeMenu">
          <button class="theme-option active" onclick="setTheme('light')"><div class="theme-dot" style="background:#fff;border-color:#d1d5db"></div><span>Clair</span></button>
          <button class="theme-option" onclick="setTheme('dark')"><div class="theme-dot" style="background:#1a1a2e;border-color:#374151"></div><span>Sombre</span></button>
          <button class="theme-option" onclick="setTheme('blue')"><div class="theme-dot" style="background:#1e3a5f;border-color:#3b82f6"></div><span>Bleu nuit</span></button>
          <button class="theme-option" onclick="setTheme('green')"><div class="theme-dot" style="background:#064e3b;border-color:#10b981"></div><span>Vert forêt</span></button>
          <button class="theme-option" onclick="setTheme('purple')"><div class="theme-dot" style="background:#4c1d95;border-color:#a78bfa"></div><span>Violet</span></button>
          <button class="theme-option" onclick="setTheme('orange')"><div class="theme-dot" style="background:#7c2d12;border-color:#f97316"></div><span>Orange</span></button>
        </div>
      </div>
    </div>

    <!-- Mobile Horizontal Category Bar -->
    <div class="mobile-cat-bar" id="mobileCatBar"></div>

    <!-- Room Grid -->
    <div class="room-list" id="roomList"></div>
  </div>

  <!-- Desktop Detail Panel -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-empty"><div style="font-size:36px;opacity:.4">📐</div><div>Sélectionnez un local<br>pour calculer Q et G</div></div>
  </div>
</div>

<!-- Mobile Bottom Sheet -->
<div class="mobile-backdrop" id="mobileBackdrop" onclick="closeSheet()"></div>
<div class="mobile-sheet" id="mobileSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title" id="sheetTitle">Détails</div>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-content" id="sheetContent"></div>
</div>

<script>
const themes={
  light:{'--dash-bg':'#ffffff','--dash-sidebar-bg':'#f8f9fa','--dash-card-bg':'#ffffff','--dash-text':'#1a1a2e','--dash-text-sec':'#6b7280','--dash-text-ter':'#9ca3af','--dash-border':'#e5e7eb','--dash-accent':'#6366f1','--dash-q-color':'#3b82f6','--dash-g-color':'#10b981','--highlight-bg':'#fef3c7','--highlight-text':'#92400e'},
  dark:{'--dash-bg':'#0f0f1a','--dash-sidebar-bg':'#1a1a2e','--dash-card-bg':'#16162a','--dash-text':'#f1f5f9','--dash-text-sec':'#94a3b8','--dash-text-ter':'#64748b','--dash-border':'#2d2d44','--dash-accent':'#818cf8','--dash-q-color':'#60a5fa','--dash-g-color':'#34d399','--highlight-bg':'#78350f','--highlight-text':'#fcd34d'},
  blue:{'--dash-bg':'#0c1e3e','--dash-sidebar-bg':'#122b4d','--dash-card-bg':'#0f2447','--dash-text':'#e0f2fe','--dash-text-sec':'#93c5fd','--dash-text-ter':'#60a5fa','--dash-border':'#1e3a5f','--dash-accent':'#38bdf8','--dash-q-color':'#60a5fa','--dash-g-color':'#22d3ee','--highlight-bg':'#1e3a5f','--highlight-text':'#fde047'},
  green:{'--dash-bg':'#022c22','--dash-sidebar-bg':'#064e3b','--dash-card-bg':'#065f46','--dash-text':'#ecfdf5','--dash-text-sec':'#6ee7b7','--dash-text-ter':'#34d399','--dash-border':'#047857','--dash-accent':'#10b981','--dash-q-color':'#34d399','--dash-g-color':'#a7f3d0','--highlight-bg':'#064e3b','--highlight-text':'#fef08a'},
  purple:{'--dash-bg':'#1e1b4b','--dash-sidebar-bg':'#2e1065','--dash-card-bg':'#312e81','--dash-text':'#f5f3ff','--dash-text-sec':'#c4b5fd','--dash-text-ter':'#a78bfa','--dash-border':'#4c1d95','--dash-accent':'#a78bfa','--dash-q-color':'#c4b5fd','--dash-g-color':'#e879f9','--highlight-bg':'#4c1d95','--highlight-text':'#fde68a'},
  orange:{'--dash-bg':'#2a1005','--dash-sidebar-bg':'#431407','--dash-card-bg':'#4a1809','--dash-text':'#fff7ed','--dash-text-sec':'#fdba74','--dash-text-ter':'#fb923c','--dash-border':'#7c2d12','--dash-accent':'#f97316','--dash-q-color':'#fb923c','--dash-g-color':'#fcd34d','--highlight-bg':'#7c2d12','--highlight-text':'#fef3c7'}
};

const categories = [
  {id:'all', name:'Tout', icon:'🌐'},
  {id:'Habitation', name:'Habitation', icon:'🏠'},
  {id:'Bureaux', name:'Bureaux', icon:'🏢'},
  {id:'Scolaire', name:'Scolaire', icon:'🎓'},
  {id:'Hospitalier', name:'Hospitalier', icon:'🏥'},
  {id:'Hôtellerie', name:'Hôtellerie', icon:'🏨'},
  {id:'Restauration', name:'Restauration', icon:'🍽️'},
  {id:'Commerce', name:'Commerce', icon:'🛒'},
  {id:'Loisirs', name:'Loisirs', icon:'🎭'},
  {id:'Spectacles', name:'Spectacles', icon:'🎬'},
  {id:'Sport', name:'Sport', icon:'⚽'},
  {id:'Industriel', name:'Industriel', icon:'🏭'},
  {id:'Transport', name:'Transport', icon:'🚗'},
  {id:'Religieux', name:'Religieux', icon:'🕌'},
  {id:'Autres', name:'Autres', icon:'📦'}
];

let currentTheme='light', currentCat='all', currentSearch='', selectedId=null;
const maxQ=1200, maxG=700;

function setTheme(name){
  currentTheme=name;
  const root=document.getElementById('dashRoot'), t=themes[name];
  for(let k in t) root.style.setProperty(k,t[k]);
  document.querySelectorAll('.theme-option').forEach(opt=>opt.classList.toggle('active',opt.getAttribute('onclick').includes("'"+name+"'")));
  document.getElementById('themeMenu').classList.remove('open');
}
function toggleThemeMenu(){ document.getElementById('themeMenu').classList.toggle('open') }
document.addEventListener('click', e=>{ if(!e.target.closest('.theme-switcher')) document.getElementById('themeMenu').classList.remove('open') });

// Synonyms Map
const synonymMap={
  'hospital':['hospital','hopital','hôpital','hospitalier','soins','medical',
