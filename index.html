<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Charges Q & G — NF P 06-001 (Application Complète)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --dash-bg:#ffffff;--dash-sidebar-bg:#f8f9fa;--dash-card-bg:#ffffff;
    --dash-text:#1a1a2e;--dash-text-sec:#6b7280;--dash-text-ter:#9ca3af;
    --dash-border:#e5e7eb;--dash-accent:#6366f1;
    --dash-q-color:#3b82f6;--dash-g-color:#10b981;
    --highlight-bg:#fef3c7;--highlight-text:#92400e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#e5e7eb;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
  .widget-root{display:flex;height:85vh;max-height:800px;width:100%;max-width:1250px;border-radius:16px;overflow:hidden;background:var(--dash-bg);box-shadow:0 20px 60px rgba(0,0,0,.15);border:1px solid var(--dash-border);transition:all .3s ease;position:relative}
  .sidebar{width:220px;background:var(--dash-sidebar-bg);border-right:1px solid var(--dash-border);padding:18px 10px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;overflow-y:auto}
  .sidebar-title{font-size:13px;font-weight:600;color:var(--dash-text);margin-bottom:10px;padding:0 8px}
  .cat-btn{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;border:none;background:transparent;color:var(--dash-text-sec);font-size:11.5px;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit}
  .cat-btn:hover{background:rgba(0,0,0,.04);color:var(--dash-text)}
  .cat-btn.active{background:var(--dash-accent);color:#fff}
  .cat-icon{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}
  .cat-btn.active .cat-icon{background:rgba(255,255,255,.2)}
  .cat-btn:not(.active) .cat-icon{background:rgba(0,0,0,.05)}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--dash-bg);position:relative}
  .topbar{padding:12px 18px;border-bottom:1px solid var(--dash-border);display:flex;align-items:center;gap:10px;background:var(--dash-bg)}
  .search-box{flex:1;position:relative}
  .search-box input{width:100%;padding:7px 11px 7px 32px;border:1px solid var(--dash-border);border-radius:10px;font-size:12px;font-family:inherit;background:var(--dash-card-bg);color:var(--dash-text);outline:none}
  .search-box input:focus{border-color:var(--dash-accent)}
  .search-box::before{content:"🔍";position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.5}
  .badge-count{font-size:11px;color:var(--dash-text-sec);background:var(--dash-sidebar-bg);padding:4px 10px;border-radius:20px;border:1px solid var(--dash-border);white-space:nowrap}
  .theme-switcher{position:relative}
  .theme-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--dash-border);background:var(--dash-card-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;color:var(--dash-text)}
  .theme-btn:hover{border-color:var(--dash-accent)}
  .theme-menu{position:absolute;top:40px;right:0;background:var(--dash-card-bg);border:1px solid var(--dash-border);border-radius:12px;padding:8px;display:none;flex-direction:column;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:100;min-width:150px}
  .theme-menu.open{display:flex}
  .theme-option{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:12px;font-family:inherit;color:var(--dash-text);transition:background .2s;width:100%;text-align:left}
  .theme-option:hover{background:var(--dash-sidebar-bg)}
  .theme-option.active{background:rgba(99,102,241,.12)}
  .theme-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--dash-border)}
  .room-list{flex:1;overflow-y:auto;padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-content:start;background:var(--dash-bg)}
  .room-card{padding:14px;border:1px solid var(--dash-border);border-radius:12px;cursor:pointer;transition:all .2s;background:var(--dash-card-bg);text-align:left;font-family:inherit;position:relative}
  .room-card:hover{border-color:var(--dash-accent);box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-2px)}
  .room-card.selected{border-color:var(--dash-accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  .room-card .room-name{font-size:13px;font-weight:600;color:var(--dash-text);line-height:1.4;margin-bottom:8px}
  .room-card .room-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
  .room-card .tag{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:500}
  .room-card .cat-tag{font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(99,102,241,.08);color:var(--dash-accent);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .room-card .match-preview{font-size:10px;color:var(--dash-text-ter);margin-top:4px;line-height:1.4;font-style:italic}
  .detail-panel{width:340px;background:var(--dash-sidebar-bg);border-left:1px solid var(--dash-border);padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex-shrink:0}
  .detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dash-text-ter);font-size:12px;text-align:center;gap:8px}
  .detail-header{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .detail-header .icon{font-size:24px}
  .detail-title{font-size:15px;font-weight:700;color:var(--dash-text);line-height:1.3}
  .detail-cat{font-size:10px;color:var(--dash-text-ter);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .big-cards{display:flex;flex-direction:column;gap:12px}
  .big-card{border-radius:14px;padding:18px;position:relative;overflow:hidden;background:var(--dash-card-bg);border:1px solid var(--dash-border)}
  .big-card.q-card{border-color:rgba(59,130,246,.3);background:linear-gradient(135deg,rgba(59,130,246,.06),var(--dash-card-bg))}
  .big-card.g-card{border-color:rgba(16,185,129,.3);background:linear-gradient(135deg,rgba(16,185,129,.06),var(--dash-card-bg))}
  .big-card .bc-label{font-size:11px;color:var(--dash-text-sec);margin-bottom:8px;display:flex;align-items:center;gap:5px;font-weight:500}
  .big-card .bc-value{font-size:36px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .big-card.q-card .bc-value{color:var(--dash-q-color)}
  .big-card.g-card .bc-value{color:var(--dash-g-color)}
  .big-card .bc-unit{font-size:11px;color:var(--dash-text-ter);margin-top:6px}
  .big-card .bc-bar{height:4px;border-radius:2px;margin-top:12px;background:var(--dash-border);overflow:hidden}
  .big-card .bc-bar-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}
  .q-card .bc-bar-fill{background:var(--dash-q-color)}
  .g-card .bc-bar-fill{background:var(--dash-g-color)}
  .q-input{width:100%;padding:10px 12px;border:2px solid var(--dash-border);border-radius:10px;font-size:16px;font-weight:700;color:var(--dash-q-color);background:var(--dash-bg);font-family:inherit;outline:none;margin-top:8px;transition:border-color .2s}
  .q-input:focus{border-color:var(--dash-q-color)}
  .range-info{font-size:11px;color:var(--dash-text-ter);margin-top:6px;font-weight:500}
  .info-section{background:var(--dash-card-bg);border:1px solid var(--dash-border);border-radius:12px;padding:14px}
  .info-section h4{font-size:10px;font-weight:700;color:var(--dash-text-sec);margin:0 0 8px 0;text-transform:uppercase;letter-spacing:.4px}
  .info-section p{font-size:12px;color:var(--dash-text-sec);line-height:1.6;margin:0}
  .scenario-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
  .scenario-table th{background:var(--dash-sidebar-bg);padding:8px 6px;text-align:left;font-weight:600;color:var(--dash-text-sec);border-bottom:2px solid var(--dash-border);font-size:9px;text-transform:uppercase;letter-spacing:.3px}
  .scenario-table td{padding:8px 6px;border-bottom:1px solid var(--dash-border);color:var(--dash-text);vertical-align:top}
  .scenario-table td:first-child{font-weight:600;color:var(--dash-text-sec);width:28%}
  .scenario-table tr:hover td{background:rgba(99,102,241,.03)}
  .scenario-table .active-row td{background:rgba(59,130,246,.08)!important;color:var(--dash-q-color)!important;font-weight:700}
  .scenario-table .active-row td:first-child{color:var(--dash-q-color)!important}
  .explanation-box{background:var(--dash-card-bg);border:1px solid var(--dash-border);border-radius:12px;padding:14px}
  .explanation-box h4{font-size:10px;font-weight:700;color:var(--dash-text-sec);margin:0 0 10px 0;text-transform:uppercase;letter-spacing:.4px}
  .explanation-box ul{margin:0;padding-left:16px;font-size:12px;color:var(--dash-text-sec);line-height:1.7}
  .explanation-box li{margin-bottom:6px}
  .ref-box{background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.15);border-radius:12px;padding:12px 14px}
  .ref-box h4{font-size:10px;font-weight:700;color:var(--dash-accent);margin:0 0 6px 0;text-transform:uppercase;letter-spacing:.4px}
  .ref-box p{font-size:11px;color:var(--dash-text-sec);margin:0;line-height:1.6}
  .hl{background:var(--highlight-bg);color:var(--highlight-text);padding:0 3px;border-radius:4px;font-weight:700}

  /* ===== MOBILE BOTTOM SHEET ===== */
  .mobile-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s ease}
  .mobile-backdrop.open{opacity:1;pointer-events:auto}
  .mobile-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--dash-bg);border-radius:20px 20px 0 0;z-index:210;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
  .mobile-sheet.open{transform:translateY(0)}
  .sheet-handle{width:36px;height:4px;background:var(--dash-border);border-radius:2px;margin:10px auto;flex-shrink:0}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px;border-bottom:1px solid var(--dash-border);flex-shrink:0}
  .sheet-title{font-size:15px;font-weight:700;color:var(--dash-text)}
  .sheet-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--dash-border);background:var(--dash-card-bg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--dash-text)}
  .sheet-content{flex:1;overflow-y:auto;padding:16px 20px 30px;display:flex;flex-direction:column;gap:14px}

  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-thumb{background:var(--dash-border);border-radius:3px}

  @media(max-width:900px){
    body{padding:0}
    .widget-root{border-radius:0;height:100vh;max-height:none;max-width:none}
    .detail-panel{display:none}
    .sidebar{width:60px;padding:12px 6px}
    .sidebar-title,.cat-btn span{display:none}
    .cat-btn{padding:10px;justify-content:center}
    .cat-icon{width:24px;height:24px;font-size:14px}
    .room-list{grid-template-columns:1fr;padding:10px}
    .room-card{padding:14px}
    .topbar{padding:10px}
  }
  @media(min-width:901px){
    .mobile-backdrop,.mobile-sheet{display:none!important}
  }
</style>
</head>
<body>

<div class="widget-root" id="dashRoot">
  <div class="sidebar">
    <div class="sidebar-title">Catégories</div>
    <button class="cat-btn active" data-cat="all" onclick="filterCat('all')"><div class="cat-icon">🌐</div><span>Tout</span></button>
    <button class="cat-btn" data-cat="Habitation" onclick="filterCat('Habitation')"><div class="cat-icon">🏠</div><span>Habitation</span></button>
    <button class="cat-btn" data-cat="Bureaux" onclick="filterCat('Bureaux')"><div class="cat-icon">🏢</div><span>Bureaux</span></button>
    <button class="cat-btn" data-cat="Scolaire" onclick="filterCat('Scolaire')"><div class="cat-icon">🎓</div><span>Scolaire</span></button>
    <button class="cat-btn" data-cat="Hospitalier" onclick="filterCat('Hospitalier')"><div class="cat-icon">🏥</div><span>Hospitalier</span></button>
    <button class="cat-btn" data-cat="Hôtellerie" onclick="filterCat('Hôtellerie')"><div class="cat-icon">🏨</div><span>Hôtellerie</span></button>

    <button class="cat-btn" data-cat="Loisirs" onclick="filterCat('Loisirs')"><div class="cat-icon">🎭</div><span>Loisirs</span></button>
    <button class="cat-btn" data-cat="Spectacles" onclick="filterCat('Spectacles')"><div class="cat-icon">🎬</div><span>Spectacles</span></button>
    <button class="cat-btn" data-cat="Sport" onclick="filterCat('Sport')"><div class="cat-icon">⚽</div><span>Sport</span></button>
    <button class="cat-btn" data-cat="Industriel" onclick="filterCat('Industriel')"><div class="cat-icon">🏭</div><span>Industriel</span></button>
    <button class="cat-btn" data-cat="Transport" onclick="filterCat('Transport')"><div class="cat-icon">🚗</div><span>Transport</span></button>

    <button class="cat-btn" data-cat="Autres" onclick="filterCat('Autres')"><div class="cat-icon">📦</div><span>Autres</span></button>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="search-box"><input type="text" id="searchInput" placeholder="Rechercher (ex: hospital, 500, terrain...)" oninput="doSearch()"></div>
      <div class="badge-count" id="countBadge">—</div>
      <div class="theme-switcher">
        <button class="theme-btn" onclick="toggleThemeMenu()">🎨</button>
        <div class="theme-menu" id="themeMenu">
          <button class="theme-option active" onclick="setTheme('light')"><div class="theme-dot" style="background:#fff;border-color:#d1d5db"></div><span>Clair</span></button>
          <button class="theme-option" onclick="setTheme('dark')"><div class="theme-dot" style="background:#1a1a2e;border-color:#374151"></div><span>Sombre</span></button>
          <button class="theme-option" onclick="setTheme('blue')"><div class="theme-dot" style="background:#1e3a5f;border-color:#3b82f6"></div><span>Bleu nuit</span></button>
          <button class="theme-option" onclick="setTheme('green')"><div class="theme-dot" style="background:#064e3b;border-color:#10b981"></div><span>Vert forêt</span></button>
          <button class="theme-option" onclick="setTheme('purple')"><div class="theme-dot" style="background:#4c1d95;border-color:#a78bfa"></div><span>Violet</span></button>
          <button class="theme-option" onclick="setTheme('orange')"><div class="theme-dot" style="background:#7c2d12;border-color:#f97316"></div><span>Orange</span></button>
        </div>
      </div>
    </div>
    <div class="room-list" id="roomList"></div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-empty"><div style="font-size:32px;opacity:.4">📐</div><div>Sélectionnez un local<br>pour voir Q et G</div></div>
  </div>
</div>

<!-- Mobile Bottom Sheet -->
<div class="mobile-backdrop" id="mobileBackdrop" onclick="closeSheet()"></div>
<div class="mobile-sheet" id="mobileSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title" id="sheetTitle">Détails</div>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-content" id="sheetContent"></div>
</div>

<script>
const themes={
  light:{'--dash-bg':'#ffffff','--dash-sidebar-bg':'#f8f9fa','--dash-card-bg':'#ffffff','--dash-text':'#1a1a2e','--dash-text-sec':'#6b7280','--dash-text-ter':'#9ca3af','--dash-border':'#e5e7eb','--dash-accent':'#6366f1','--dash-q-color':'#3b82f6','--dash-g-color':'#10b981','--highlight-bg':'#fef3c7','--highlight-text':'#92400e'},
  dark:{'--dash-bg':'#0f0f1a','--dash-sidebar-bg':'#1a1a2e','--dash-card-bg':'#16162a','--dash-text':'#f1f5f9','--dash-text-sec':'#94a3b8','--dash-text-ter':'#64748b','--dash-border':'#2d2d44','--dash-accent':'#818cf8','--dash-q-color':'#60a5fa','--dash-g-color':'#34d399','--highlight-bg':'#78350f','--highlight-text':'#fcd34d'},
  blue:{'--dash-bg':'#0c1e3e','--dash-sidebar-bg':'#122b4d','--dash-card-bg':'#0f2447','--dash-text':'#e0f2fe','--dash-text-sec':'#93c5fd','--dash-text-ter':'#60a5fa','--dash-border':'#1e3a5f','--dash-accent':'#38bdf8','--dash-q-color':'#60a5fa','--dash-g-color':'#22d3ee','--highlight-bg':'#1e3a5f','--highlight-text':'#fde047'},
  green:{'--dash-bg':'#022c22','--dash-sidebar-bg':'#064e3b','--dash-card-bg':'#065f46','--dash-text':'#ecfdf5','--dash-text-sec':'#6ee7b7','--dash-text-ter':'#34d399','--dash-border':'#047857','--dash-accent':'#10b981','--dash-q-color':'#34d399','--dash-g-color':'#a7f3d0','--highlight-bg':'#064e3b','--highlight-text':'#fef08a'},
  purple:{'--dash-bg':'#1e1b4b','--dash-sidebar-bg':'#2e1065','--dash-card-bg':'#312e81','--dash-text':'#f5f3ff','--dash-text-sec':'#c4b5fd','--dash-text-ter':'#a78bfa','--dash-border':'#4c1d95','--dash-accent':'#a78bfa','--dash-q-color':'#c4b5fd','--dash-g-color':'#e879f9','--highlight-bg':'#4c1d95','--highlight-text':'#fde68a'},
  orange:{'--dash-bg':'#2a1005','--dash-sidebar-bg':'#431407','--dash-card-bg':'#4a1809','--dash-text':'#fff7ed','--dash-text-sec':'#fdba74','--dash-text-ter':'#fb923c','--dash-border':'#7c2d12','--dash-accent':'#f97316','--dash-q-color':'#fb923c','--dash-g-color':'#fcd34d','--highlight-bg':'#7c2d12','--highlight-text':'#fef3c7'}
};
let currentTheme='light',currentCat='all',currentSearch='',selectedId=null;
const maxQ=1200,maxG=700;

function setTheme(name){
  currentTheme=name;
  const root=document.getElementById('dashRoot'),t=themes[name];
  for(let k in t)root.style.setProperty(k,t[k]);
  document.querySelectorAll('.theme-option').forEach(opt=>opt.classList.toggle('active',opt.getAttribute('onclick').includes("'"+name+"'")));
  document.getElementById('themeMenu').classList.remove('open');
}
function toggleThemeMenu(){document.getElementById('themeMenu').classList.toggle('open')}
document.addEventListener('click',e=>{if(!e.target.closest('.theme-switcher'))document.getElementById('themeMenu').classList.remove('open')});

// ==================== SYNONYMES ====================
const synonymMap={
  'hospital':['hospital','hopital','hôpital','hospitalier','soins','medical','médical','clinique','chirurgie','patient','infirmerie','sante','santé'],
  'hopital':['hospital','hopital','hôpital','hospitalier','soins','medical','médical','clinique'],
  'cuisine':['cuisine','restaurant','restauration','chef','alimentaire','collective','depot','dépôt','stockage alimentaire','cantine','réfectoire','refectoire'],
  'restaurant':['restaurant','restauration','salle','bar','lounge','cafétéria','cantine','réfectoire','refectoire','brasserie'],
  'bureau':['bureau','bureaux','office','administration','open-space','openspace','travail','open space','openspace'],
  'ecole':['scolaire','école','ecole','classe','amphithéâtre','amphi','cantine scolaire','etudiant','étudiant','enseignement','lycee','lycée','college','collège'],
  'school':['scolaire','école','ecole','classe','amphithéâtre','amphi','etudiant','étudiant','enseignement'],
  'habitation':['habitation','logement','appartement','maison','residentiel','résidentiel','domicile','balcon','grenier','comble','toit','terrasse'],
  'loisir':['loisir','loisirs','spectacle','theatre','théâtre','conference','conférence','culte','golf','sport','detente','détente','jeux','game'],
  'sante':['hospitalier','soins','medical','médical','sante','santé','infirmerie','operation','opération','pharmacie','dentiste'],
  'stockage':['stockage','depot','dépôt','reserve','réserve','entrepot','entrepôt','garage','parking','magasin','archive','soussol','sous-sol'],
  'salle':['salle','hall','amphithéâtre','amphi','reunion','réunion','conference','conférence','exposition','projection','seminaire','séminaire'],
  'toit':['toit','terrasse','comble','grenier','etancheite','étanchéité','couverture','zinc','tuile'],
  'balcon':['balcon','terrasse','loggia','vue','exterieur','extérieur','balustrade'],
  'escalier':['escalier','hall','circulation','passage','entree','entrée','corridor','couloir'],
  'nf':['nf','norme','p 06-001','p 06-004','reglementation','réglementation','dtu','eurocode','bael','eurocodes'],
  'q':['charge exploitation','q','surcharge','exploitation','variable','occupation','dalle','plancher'],
  'g':['charge permanente','g','permanente','poids propre','structure','dead load','cloison','enduit'],

function normalizeText(text){
  if(!text)return'';
  return text.toLowerCase()
    .replace(/[àáâãäå]/g,'a').replace(/[èéêë]/g,'e').replace(/[ìíîï]/g,'i')
    .replace(/[òóôõö]/g,'o').replace(/[ùúûü]/g,'u').replace(/[ç]/g,'c')
    .replace(/[œ]/g,'oe').replace(/[æ]/g,'ae').replace(/[^a-z0-9\s]/g,'');
}

function expandSearchTerms(rawQuery){
  const normalized=normalizeText(rawQuery).trim();
  if(!normalized)return[];
  const terms=[normalized];
  for(let key in synonymMap){
    if(normalized.includes(key)||key.includes(normalized)){
      terms.push(...synonymMap[key].map(normalizeText));
    }
  }
  normalized.split(/\s+/).forEach(word=>{
    if(word.length>2)terms.push(word);
    for(let key in synonymMap){
      if(word.includes(key)||key.includes(word)){
        terms.push(...synonymMap[key].map(normalizeText));
      }
    }
  });
  return[...new Set(terms)];
}

function smartSearch(room,terms){
  const haystack=normalizeText(room.name+' '+room.cat+' '+room.desc+' '+room.explanation+' '+room.q+' '+room.g);
  let score=0;
  terms.forEach(term=>{if(haystack.includes(term))score+=1;});
  return score;
}

function highlightText(text,terms){
  if(!terms.length)return text;
  let html=text;
  const seen=new Set();
  terms.forEach(term=>{
    if(seen.has(term)||term.length<2)return;
    seen.add(term);
    const escaped=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try{
      const regex=new RegExp(`(${escaped})`,'gi');
      html=html.replace(regex,'<span class="hl">$1</span>');
    }catch(e){}
  });
  return html;
}

function getScenarioHTML(r){
  const s=scenarios[r.name];
  if(!s||r.qMin===r.qMax)return'';
  const isLow=Math.abs(r.q-s.low.val)<20;
  const isMid=Math.abs(r.q-s.mid.val)<20;
  const isHigh=Math.abs(r.q-s.high.val)<20;
  return `
  <div class="info-section">
    <h4>📊 Scénarios d'aménagement — Quand choisir quelle valeur ?</h4>
    <table class="scenario-table">
      <thead><tr><th>Scénario</th><th>Valeur Q</th><th>Description</th></tr></thead>
      <tbody>
        <tr class="${isLow?'active-row':''}"><td>🟢 Léger / Minimal</td><td>${s.low.val} kg/m²</td><td>${s.low.desc}</td></tr>
        <tr class="${isMid?'active-row':''}"><td>🟡 Standard / Moyen</td><td>${s.mid.val} kg/m²</td><td>${s.mid.desc}</td></tr>
        <tr class="${isHigh?'active-row':''}"><td>🔴 Lourd / Dense</td><td>${s.high.val} kg/m²</td><td>${s.high.desc}</td></tr>
      </tbody>
    </table>
    <p style="font-size:10px;color:var(--dash-text-ter);margin-top:8px;font-style:italic">💡 Modifiez Q ci-dessus pour voir le scénario correspondant se surligner.</p>
  </div>`;
}

// ==================== RENDU ====================
function renderRooms(){
  const list=document.getElementById('roomList');
  list.innerHTML='';
  let filtered;
  const rawSearch=document.getElementById('searchInput').value.trim();

  if(rawSearch){
    const terms=expandSearchTerms(rawSearch);
    const scored=rooms.map((r,idx)=>({room:r,idx,score:smartSearch(r,terms)}))
      .filter(item=>item.score>0)
      .sort((a,b)=>b.score-a.score);
    filtered=scored.map(item=>item.room);
    currentSearch=rawSearch;
  }else{
    filtered=rooms.filter(r=>currentCat==='all'||r.cat===r.cat && (currentCat==='all'||r.cat===currentCat));
    currentSearch='';
  }

  document.getElementById('countBadge').textContent=filtered.length+' résultat'+(filtered.length>1?'s':'');

  if(filtered.length===0){
    list.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--dash-text-ter);font-size:13px">
      <div style="font-size:32px;margin-bottom:10px">🔍</div>
      Aucun résultat pour "<strong>${rawSearch}</strong>"<br>
      <span style="font-size:11px">Essayez : hospital, cuisine, 500, terrain, foot...</span>
    </div>`;
    return;
  }

  const terms=currentSearch?expandSearchTerms(currentSearch):[];

  filtered.forEach(r=>{
    const realIdx=rooms.indexOf(r);
    const card=document.createElement('button');
    card.className='room-card'+(selectedId===realIdx?' selected':'');
    card.onclick=()=>showDetail(realIdx);

    const nameHtml=highlightText(r.name,terms);
    const qTag=r.qMin!==r.qMax
      ?`<span class="tag" style="background:rgba(59,130,246,.12);color:var(--dash-q-color)">Q: ${r.qMin}-${r.qMax}</span>`
      :`<span class="tag" style="background:rgba(59,130,246,.12);color:var(--dash-q-color)">Q: ${r.q}</span>`;
    const gTag=`<span class="tag" style="background:rgba(16,185,129,.12);color:var(--dash-g-color)">G: ${r.g}</span>`;

    let matchPreview='';
    if(terms.length){
      const hay=normalizeText(r.name+r.desc+r.explanation+r.cat);
      const matchedField=terms.find(t=>hay.includes(t));
      if(matchedField){
        const fullText=r.name+' | '+r.desc+' | '+r.explanation;
        const idx=normalizeText(fullText).indexOf(matchedField);
        if(idx>=0){
          const start=Math.max(0,idx-25);
          const end=Math.min(fullText.length,idx+matchedField.length+25);
          let snippet=fullText.substring(start,end);
          if(start>0)snippet='...'+snippet;
          if(end<fullText.length)snippet=snippet+'...';
          matchPreview=`<div class="match-preview">${highlightText(snippet,terms)}</div>`;
        }
      }
    }

    card.innerHTML=`<div class="room-name">${nameHtml}</div><div class="room-tags"><span class="cat-tag">${r.cat}</span>${qTag}${gTag}</div>${matchPreview}`;
    list.appendChild(card);
  });
}

function filterCat(cat){
  currentCat=cat;
  document.getElementById('searchInput').value='';
  currentSearch='';
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  renderRooms();
}

function doSearch(){
  renderRooms();
}

function buildDetailHTML(r){
  const isVariableQ=r.qMin!==r.qMax;
  const qInput=isVariableQ
    ?`<input type="number" class="q-input" id="qEdit" value="${r.q}" min="${r.qMin}" max="${r.qMax}" onchange="updateQ(${rooms.indexOf(r)},this.value)"><div class="range-info">📏 Plage autorisée : ${r.qMin} – ${r.qMax} kg/m²</div>`
    :`<div class="bc-value">${r.q}</div><div class="bc-unit">kg/m² (valeur fixe NF P 06-001)</div>`;

  return `
    <div class="detail-header">
      <span class="icon">${getCatIcon(r.cat)}</span>
      <div>
        <div class="detail-title">${r.name}</div>
        <div class="detail-cat">${r.cat}</div>
      </div>
    </div>
    <div class="big-cards">
      <div class="big-card q-card">
        <div class="bc-label">⚖️ Charge d'exploitation (Q)</div>
        ${qInput}
        <div class="bc-bar"><div class="bc-bar-fill" style="width:${Math.min(100,r.q/maxQ*100)}%"></div></div>
      </div>
      <div class="big-card g-card">
        <div class="bc-label">🏗️ Charge permanente (G)</div>
        <div class="bc-value">${r.g}</div>
        <div class="bc-unit">kg/m²</div>
        <div class="bc-bar"><div class="bc-bar-fill" style="width:${Math.min(100,r.g/maxG*100)}%"></div></div>
      </div>
    </div>
    <div class="info-section">
      <h4>📋 Description technique</h4>
      <p>${r.desc}</p>
    </div>
    ${getScenarioHTML(r)}
    <div class="explanation-box">
      <h4>💡 Pourquoi cette valeur ?</h4>
      <ul>
        <li>${r.explanation}</li>
        ${isVariableQ?`<li><strong>✏️ Vous pouvez modifier Q</strong> entre ${r.qMin} et ${r.qMax} kg/m² selon l'aménagement réel du local.</li>`:''}
        ${r.cat==='Restauration'?`<li>📖 NF P 06-001 § 5.2 : les locaux de restauration ont des charges variables selon la densité d'occupation et le mobilier.</li>`:''}
        ${r.cat==='Hospitalier'?`<li>📖 NF P 06-004 : les établissements de santé nécessitent des charges majorées pour les équipements techniques.</li>`:''}
        ${r.cat==='Sport'?`<li>📖 NF P 06-001 § 5.5 : les locaux sportifs et de spectacle ont des charges élevées dues aux rassemblements de public.</li>`:''}
        ${r.cat==='Industriel'?`<li>📖 NF P 06-001 § 6 : les locaux industriels nécessitent des charges adaptées aux machines et aux chutes de charges.</li>`:''}
      </ul>
    </div>
    <div class="ref-box">
      <h4>📚 Références normatives</h4>
      <p><strong>NF P 06-001</strong> (juin 1978) : Bases de calcul des ouvrages de construction — Charges d'exploitation des bâtiments.<br><br>
      <strong>NF P 06-004</strong> : Actions du vent, de la neige, et charges d'exploitation spécifiques (hôpitaux, écoles, etc.).<br><br>
      <em>Article 3 :</em> Les charges d'exploitation Q sont des charges variables définies selon la destination des locaux.<br>
      <em>Article 5 :</em> Valeurs minimales et maximales selon les catégories d'usage (habitation, bureaux, écoles, hôpitaux, commerces, restaurants, etc.).<br>
      <em>Article 6 :</em> Locaux industriels et locaux à usages spéciaux — charges à définir selon l'exploitation prévue.</p>
    </div>
  `;
}

function showDetail(id){
  selectedId=id;
  renderRooms();
  const r=rooms[id];

  // Desktop panel
  document.getElementById('detailPanel').innerHTML=buildDetailHTML(r);

  // Mobile sheet
  document.getElementById('sheetTitle').textContent=r.name;
  document.getElementById('sheetContent').innerHTML=buildDetailHTML(r);
  document.getElementById('mobileBackdrop').classList.add('open');
  document.getElementById('mobileSheet').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeSheet(){
  document.getElementById('mobileBackdrop').classList.remove('open');
  document.getElementById('mobileSheet').classList.remove('open');
  document.body.style.overflow='';
}

function updateQ(id,newVal){
  const val=parseFloat(newVal);
  const r=rooms[id];
  if(val>=r.qMin&&val<=r.qMax){
    r.q=val;
    showDetail(id);
  }else{
    alert(`❌ Valeur hors plage !\nAutorisé : ${r.qMin} – ${r.qMax} kg/m²`);
    const input=document.getElementById('qEdit');
    if(input)input.value=r.q;
  }
}

function getCatIcon(cat){
  const map={Habitation:'🏠',Bureaux:'🏢',Scolaire:'🎓',Hospitalier:'🏥',Hôtellerie:'🏨',Restauration:'🍽️',Commerce:'🛒',Loisirs:'🎭',Spectacles:'🎬',Sport:'⚽',Industriel:'🏭',Transport:'🚗',Religieux:'🕌',Autres:'📦'};
  return map[cat]||'📐';
}

// Swipe down to close sheet
let sheetTouchStartY=0;
document.getElementById('mobileSheet').addEventListener('touchstart',e=>{sheetTouchStartY=e.touches[0].clientY;});
document.getElementById('mobileSheet').addEventListener('touchend',e=>{
  const diff=e.changedTouches[0].clientY-sheetTouchStartY;
  if(diff>80)closeSheet();
});

// Init
renderRooms();
</script>
</body>
</html>
